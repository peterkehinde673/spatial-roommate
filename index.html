<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050a18" />
  <meta
    name="description"
    content="ROOMMATE is a spatial AI productivity companion that turns goals into an interactive workspace."
  />
  <meta property="og:title" content="ROOMMATE — Spatial AI Companion" />
  <meta
    property="og:description"
    content="Turn a goal into a spatial workspace, make progress with interactive task objects, and return to where you left off."
  />
  <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0b1020" />
    <title>Spatial Roommate</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b1020;
        font-family: system-ui, sans-serif;
      }

      #scene-container {
        width: 100%;
        height: 100%;
      }

      #runtime-status {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        color: #e2e8f0;
        text-align: center;
        font-size: 18px;
        background: #0b1020;
        z-index: 10;
      }

      #runtime-status.error {
        color: #fecaca;
      }

      .roommate-hud {
  position: fixed;
  top: 16px;
  left: 16px;
  right: 16px;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  gap: 12px;
  pointer-events: none;
}
.roommate-hud-card {
  max-width: 72%;
  padding: 10px 14px;
  border: 1px solid rgba(148, 163, 184, 0.2);
  border-radius: 14px;
  background: rgba(15, 23, 42, 0.78);
  color: #f8fafc;
  backdrop-filter: blur(12px);
}
.roommate-hud-goal {
  font-size: 13px;
  color: #cbd5e1;
}
.roommate-hud-progress {
  margin-top: 2px;
  font-size: 15px;
  font-weight: 700;
}
.roommate-hud-hint {
  align-self: center;
  padding: 9px 12px;
  border-radius: 12px;
  background: rgba(14, 116, 144, 0.82);
  color: #f8fafc;
  font-size: 13px;
  font-weight: 700;
}
.goal-panel {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        z-index: 20;
        background: rgba(5, 10, 24, 0.72);
      }

      .goal-panel-card {
        width: min(520px, 100%);
        box-sizing: border-box;
        padding: 28px;
        border: 1px solid rgba(148, 163, 184, 0.24);
        border-radius: 24px;
        background: #111827;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
      }

      .goal-panel-title {
        color: #f8fafc;
        font-size: clamp(26px, 6vw, 38px);
        font-weight: 750;
        margin-bottom: 10px;
      }

      .goal-panel-subtitle {
        color: #cbd5e1;
        font-size: 16px;
        line-height: 1.5;
        margin-bottom: 20px;
      }

      .roommate-hud-hint {
  min-width: 132px;
  text-align: center;
}
.roommate-hud-hint.is-complete {
  background: rgba(22, 101, 52, 0.9);
}
.roommate-hud-hint.is-active {
  box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.2);
}
@media (prefers-reduced-motion: reduce) {
  .roommate-hud-card,
  .roommate-hud-hint {
    scroll-behavior: auto;
  }
}
@media (max-width: 600px) {
  .roommate-hud {
    top: 10px;
    left: 10px;
    right: 10px;
    gap: 8px;
  }
  .roommate-hud-card {
    max-width: 62%;
    padding: 9px 11px;
  }
  .roommate-hud-goal {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .roommate-hud-progress {
    font-size: 14px;
  }
  .roommate-hud-hint {
    min-width: 112px;
    padding: 8px 9px;
    font-size: 12px;
  }
}

.goal-panel button {
        display: block;
        width: 100%;
        min-height: 58px;
        margin-top: 12px;
        border: 0;
        border-radius: 14px;
        background: #1e293b;
        color: #f8fafc;
        font: inherit;
        font-size: 17px;
        font-weight: 650;
        cursor: pointer;
        touch-action: manipulation;
      }

      .goal-panel button:hover,
      .goal-panel button:focus-visible {
        background: #334155;
        outline: 2px solid #38bdf8;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <div id="runtime-status">Starting Spatial Roommate…</div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
