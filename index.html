<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <title>Spatial Roommate</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b1020;
        font-family: system-ui, sans-serif;
      }

      #scene-container {
        width: 100%;
        height: 100%;
      }

      #runtime-status {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        color: #e2e8f0;
        text-align: center;
        font-size: 18px;
        background: #0b1020;
        z-index: 10;
      }

      #runtime-status.error {
        color: #fecaca;
      }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <div id="runtime-status">Starting Spatial Roommate…</div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
